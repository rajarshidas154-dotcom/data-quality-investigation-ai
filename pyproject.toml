[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-assistant"
version = "0.1.0"
description = "Local data quality investigation with scikit-learn, retrieval and MCP"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.12,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["dqa*"]

[tool.setuptools.package-data]
dqa = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

